<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Timer</title>
    <link rel="stylesheet" href="/tool-kit.css" />
    <style>
      body { display: flex; flex-direction: column; }
      .wrap { width: 100%; }

      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 10px 0 26px;
      }
      /* Break button pinned to the top-right of the timer stage */
      .break-top {
        position: absolute;
        top: 0;
        right: 0;
      }

      .phase-pill {
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .phase-pill.break {
        background: color-mix(in srgb, var(--ice) 20%, transparent);
        color: var(--ice);
        border-color: color-mix(in srgb, var(--ice) 45%, transparent);
      }

      .ring-wrap { position: relative; width: clamp(240px, 56vmin, 340px); aspect-ratio: 1; }
      .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring .track { fill: none; stroke: var(--surface-2); stroke-width: 12; }
      .ring .prog { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke 0.3s ease; }
      .ring .prog.break { stroke: var(--ice); }
      .ring .prog.paused { opacity: 0.4; }
      .time {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: clamp(40px, 10.5vmin, 66px); font-weight: 800;
        font-variant-numeric: tabular-nums; letter-spacing: 1px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      .status { color: var(--muted); font-size: 14px; min-height: 20px; text-align: center; }
      .totals { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .totals b { color: var(--text); font-weight: 700; }

      .task-row { width: min(440px, 100%); }
      select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
               background: var(--surface); color: var(--text); font: inherit; }
      select:disabled { opacity: 0.7; }

      .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .controls .btn { min-width: 110px; }
      .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
      .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
      .btn:disabled { opacity: 0.4; cursor: default; }

      .panel { display: flex; flex-direction: column; gap: 18px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
      .stat-card { text-align: center; }

      .day-head { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
                  color: var(--muted); margin: 14px 0 8px; }
      .rec { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
             border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
      .rec .task { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rec .task.empty { color: var(--muted); }
      .rec .dur { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
      .rec .brk { color: var(--muted); font-size: 12px; flex-shrink: 0; }
      .rec .del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; flex-shrink: 0; }
      .rec .del:hover { color: var(--err); }
      .table-head { display: flex; justify-content: space-between; align-items: center; }

      #stage:fullscreen { width: 100%; height: 100%; justify-content: center; background: var(--bg); gap: 24px; padding: 24px; }
      #stage:fullscreen .ring-wrap { width: min(64vmin, 520px); }
      body.fs .panel, body.fs h1, body.fs .sub { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Work Timer</h1>
      <p class="sub">Pick a task from your To-Do list and time it. Work and break are tracked separately, saved by day.</p>

      <div id="stage" class="stage">
        <button class="btn ghost break-top" id="breakBtn" disabled>Break</button>
        <span class="phase-pill" id="pill">WORK</span>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 240 240">
            <circle class="track" cx="120" cy="120" r="108" />
            <circle class="prog" id="prog" cx="120" cy="120" r="108" />
          </svg>
          <div class="time" id="time">00:00</div>
        </div>
        <div class="status" id="status">Select a task to start</div>
        <div class="totals" id="totals"></div>

        <div class="task-row">
          <select id="task" title="Task from your To-Do list"></select>
        </div>

        <div class="controls">
          <button class="btn" id="startBtn">Start</button>
          <button class="btn ghost" id="endBtn" disabled>End</button>
          <button class="btn ghost" id="fsBtn">Full Screen</button>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="card stat-card">
            <div class="stat-label">Today's work</div>
            <div class="stat" id="today">0m</div>
          </div>
          <div class="card stat-card">
            <div class="stat-label">Avg / working day</div>
            <div class="stat" id="avg">0m</div>
          </div>
          <div class="card stat-card">
            <div class="stat-label">Days tracked</div>
            <div class="stat" id="days">0</div>
          </div>
        </div>

        <div>
          <div class="table-head">
            <h3 style="margin: 0">History</h3>
            <button class="btn ghost" id="clearBtn">Clear all</button>
          </div>
          <div id="recs" style="margin-top: 6px"></div>
          <p class="note" id="empty" hidden>No sessions yet — pick a task and press Start.</p>
        </div>
      </div>
    </div>

    <script>
      const wt = (p, body) =>
        fetch("/api/work-timer" + p, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        }).then((r) => r.json());

      const $ = (id) => document.getElementById(id);
      const prog = $("prog");
      const C = 2 * Math.PI * 108;
      prog.style.strokeDasharray = C;
      prog.style.strokeDashoffset = 0; // full ring (count-up, decorative)

      let records = [];
      let todoTasks = [];
      // mode: 'idle' | 'work' | 'break'
      const st = { task: "", mode: "idle", running: false, workSec: 0, breakSec: 0 };

      // ---- formatting (local timezone) ----
      function fmt(s) {
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
        const mm = String(m).padStart(2, "0"), sss = String(ss).padStart(2, "0");
        return h > 0 ? h + ":" + mm + ":" + sss : mm + ":" + sss;
      }
      function fmtShort(sec) {
        sec = Math.round(sec);
        const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
        if (h && m) return h + "h " + m + "m";
        if (h) return h + "h";
        return m + "m";
      }
      const localDay = (ts) => new Date(ts).toDateString();
      function dayLabel(ts) {
        const d = new Date(ts), today = new Date();
        const yest = new Date(); yest.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return "Today";
        if (d.toDateString() === yest.toDateString()) return "Yesterday";
        return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
      }

      // ---- To-Do task picker ----
      async function loadTasks() {
        try {
          const data = await fetch("/api/todo/list").then((r) => r.json());
          todoTasks = (data.tasks || []).filter((t) => !t.done);
        } catch { todoTasks = []; }
        fillTaskPicker();
      }
      function fillTaskPicker() {
        if (st.mode !== "idle") return; // don't disturb an active session
        const sel = $("task");
        const prev = sel.value;
        sel.innerHTML = "";
        if (!todoTasks.length) {
          const o = document.createElement("option");
          o.value = ""; o.textContent = "No tasks — add some in To-Do"; o.disabled = true; o.selected = true;
          sel.appendChild(o);
          sel.disabled = true;
        } else {
          sel.disabled = false;
          for (const t of todoTasks) {
            const o = document.createElement("option");
            o.value = t.id; o.textContent = t.text;
            sel.appendChild(o);
          }
          if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
        }
        render();
      }

      // ---- rendering ----
      function render() {
        const isBreak = st.mode === "break";
        $("pill").textContent = isBreak ? "BREAK" : "WORK";
        $("pill").className = "phase-pill " + (isBreak ? "break" : "");
        prog.classList.toggle("break", isBreak);
        prog.classList.toggle("paused", !st.running && st.mode !== "idle");
        $("time").textContent = fmt(isBreak ? st.breakSec : st.workSec);

        if (st.mode === "idle") {
          $("status").textContent = todoTasks.length ? "Select a task and press Start" : "Add a task in To-Do first";
          $("totals").textContent = "";
        } else {
          $("status").textContent =
            (isBreak ? "On break" : "Working") + (st.running ? "" : " (paused)") +
            (st.task ? " — " + st.task : "");
          $("totals").innerHTML = "Work <b>" + fmt(st.workSec) + "</b> · Break <b>" + fmt(st.breakSec) + "</b>";
        }

        $("startBtn").textContent = st.mode === "idle" ? "Start" : st.running ? "Pause" : "Resume";
        $("startBtn").disabled = st.mode === "idle" && todoTasks.length === 0;
        $("breakBtn").textContent = isBreak ? "Resume Work" : "Break";
        $("breakBtn").disabled = st.mode === "idle";
        $("endBtn").disabled = st.mode === "idle";
        $("task").disabled = st.mode !== "idle";
        renderStats();
      }
      function renderStats() {
        const byDay = {};
        for (const r of records) byDay[localDay(r.end)] = (byDay[localDay(r.end)] || 0) + r.seconds;
        let today = byDay[new Date().toDateString()] || 0;
        if (st.mode !== "idle") today += st.workSec; // live
        const totals = Object.values(byDay), days = totals.length;
        const avg = days ? totals.reduce((a, b) => a + b, 0) / days : 0;
        $("today").textContent = fmtShort(today);
        $("avg").textContent = fmtShort(avg);
        $("days").textContent = days;
      }
      function renderRecords() {
        const box = $("recs");
        box.innerHTML = "";
        $("empty").hidden = records.length > 0;
        let currentDay = null;
        for (const r of records) {
          const day = localDay(r.end);
          if (day !== currentDay) {
            currentDay = day;
            const h = document.createElement("div");
            h.className = "day-head";
            h.textContent = dayLabel(r.end);
            box.appendChild(h);
          }
          const div = document.createElement("div");
          div.className = "rec";
          const dur = document.createElement("span");
          dur.className = "dur"; dur.textContent = fmtShort(r.seconds);
          const task = document.createElement("span");
          task.className = "task" + (r.label ? "" : " empty");
          task.textContent = r.label || "—";
          if (r.label) task.title = r.label;
          const brk = document.createElement("span");
          brk.className = "brk";
          brk.textContent = r.breakSeconds ? "break " + fmtShort(r.breakSeconds) : "";
          const del = document.createElement("button");
          del.className = "del"; del.textContent = "✕"; del.title = "Delete";
          del.onclick = async () => { const db = await wt("/delete", { id: r.id }); records = db.records; renderRecords(); render(); };
          div.append(dur, task, brk, del);
          box.appendChild(div);
        }
      }

      // ---- tick ----
      setInterval(() => {
        if (!st.running) return;
        if (st.mode === "work") st.workSec++;
        else if (st.mode === "break") st.breakSec++;
        render();
      }, 1000);

      // ---- controls ----
      $("startBtn").onclick = () => {
        if (st.mode === "idle") {
          const sel = $("task");
          if (!sel.value) return;
          st.task = sel.selectedOptions[0]?.textContent || "";
          st.mode = "work";
          st.running = true;
        } else {
          st.running = !st.running; // pause / resume current phase
        }
        render();
      };

      $("breakBtn").onclick = () => {
        if (st.mode === "idle") return;
        st.mode = st.mode === "work" ? "break" : "work"; // the other counter freezes automatically
        st.running = true;
        render();
      };

      $("endBtn").onclick = async () => {
        if (st.mode === "idle") return;
        if (st.workSec > 0 || st.breakSec > 0) {
          const db = await wt("/record", { seconds: st.workSec, breakSeconds: st.breakSec, label: st.task });
          records = db.records;
          renderRecords();
        }
        st.mode = "idle"; st.running = false; st.workSec = 0; st.breakSec = 0; st.task = "";
        fillTaskPicker();
      };

      $("clearBtn").onclick = async () => {
        if (!confirm("Delete ALL history? This cannot be undone.")) return;
        const db = await wt("/clear", {});
        records = db.records; renderRecords(); render();
      };

      // Safety net: save an in-progress session if the tab is closed.
      window.addEventListener("pagehide", () => {
        if (st.mode !== "idle" && (st.workSec > 0 || st.breakSec > 0)) {
          const blob = new Blob(
            [JSON.stringify({ seconds: st.workSec, breakSeconds: st.breakSec, label: st.task })],
            { type: "application/json" }
          );
          navigator.sendBeacon("/api/work-timer/record", blob);
        }
      });

      // ---- fullscreen ----
      const stage = $("stage");
      $("fsBtn").onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (stage.requestFullscreen) stage.requestFullscreen();
      };
      document.addEventListener("fullscreenchange", () => {
        const on = !!document.fullscreenElement;
        document.body.classList.toggle("fs", on);
        $("fsBtn").textContent = on ? "Exit Full Screen" : "Full Screen";
      });

      // keep the task list fresh (picks up new To-Do tasks automatically)
      setInterval(loadTasks, 4000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) loadTasks(); });

      // ---- init ----
      (async () => {
        const db = await wt("/state");
        records = db.records || [];
        renderRecords();
        await loadTasks();
      })();
    </script>
  </body>
</html>
