<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="/tool-kit.css?v=2" />
    <style>
      .add-row { display: flex; gap: 10px; margin-bottom: 22px; }
      .add-row input { flex: 1; }

      ul.tasks { list-style: none; margin: 0; padding: 0; }
      li.task {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        margin-bottom: 8px;
      }
      li.task.done .text { text-decoration: line-through; color: var(--muted); }
      li.task.dragging { opacity: 0.4; border-color: var(--accent); }
      li.task.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }

      .grip {
        cursor: grab;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        user-select: none;
        flex-shrink: 0;
      }
      .grip:hover { color: var(--text); }
      li.task.dragging .grip { cursor: grabbing; }

      .check {
        width: 22px; height: 22px; flex-shrink: 0;
        border: 2px solid var(--border); border-radius: 6px;
        cursor: pointer; display: grid; place-items: center;
        color: transparent; font-size: 14px; font-weight: 700;
      }
      .task.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

      .text { flex: 1; cursor: text; outline: none; padding: 2px 0; min-width: 0; }
      .icon-btn {
        border: none; background: transparent; color: var(--muted);
        cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 5px; border-radius: 6px;
        flex-shrink: 0;
      }
      .icon-btn.del:hover { color: var(--err); }

      .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap" style="max-width: 620px">
      <h1>✓ To-Do</h1>
      <p class="sub">Drag the ⠿ handle to reorder. Click a task to edit it. Tasks appear in the Work Timer automatically.</p>

      <div class="add-row">
        <input type="text" id="new" placeholder="Add a task and press Enter…" autofocus />
        <button class="btn" id="add">Add</button>
      </div>

      <ul class="tasks" id="list"></ul>

      <div class="foot">
        <span class="note" id="count"></span>
        <button class="btn secondary" id="clear">Clear completed</button>
      </div>
    </div>

    <script>
      const list = document.getElementById("list");
      const api = (p, body) =>
        fetch("/api/todo" + p, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        }).then((r) => r.json());

      let tasks = [];

      async function refresh() {
        ({ tasks } = await api("/list"));
        render();
      }

      function render() {
        list.innerHTML = "";
        if (!tasks.length) {
          list.innerHTML = '<p class="note">Nothing here yet. Add your first task above.</p>';
        }
        tasks.forEach((t) => {
          const li = document.createElement("li");
          li.className = "task" + (t.done ? " done" : "");
          li.dataset.id = t.id;

          // drag handle (only the handle starts a drag, so text stays editable)
          const grip = document.createElement("span");
          grip.className = "grip";
          grip.textContent = "⠿";
          grip.title = "Drag to reorder";
          grip.addEventListener("mousedown", () => { li.draggable = true; });
          grip.addEventListener("mouseup", () => { li.draggable = false; });

          const check = document.createElement("div");
          check.className = "check";
          check.textContent = "✓";
          check.title = "Toggle done";
          check.onclick = async () => { await api("/toggle", { id: t.id }); refresh(); };

          const text = document.createElement("div");
          text.className = "text";
          text.textContent = t.text;
          text.contentEditable = "true";
          text.spellcheck = false;
          text.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); text.blur(); } };
          text.onblur = async () => {
            const v = text.textContent.trim();
            if (v && v !== t.text) await api("/edit", { id: t.id, text: v });
            else text.textContent = t.text;
          };

          const del = document.createElement("button");
          del.className = "icon-btn del"; del.textContent = "✕"; del.title = "Delete";
          del.onclick = async () => { await api("/delete", { id: t.id }); refresh(); };

          // drag events
          li.addEventListener("dragstart", () => li.classList.add("dragging"));
          li.addEventListener("dragend", async () => {
            li.classList.remove("dragging");
            li.draggable = false;
            await persistOrder();
          });

          li.appendChild(grip);
          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(del);
          list.appendChild(li);
        });

        const done = tasks.filter((t) => t.done).length;
        document.getElementById("count").textContent =
          tasks.length ? `${done} of ${tasks.length} done` : "";
      }

      // reorder the dragged item within the list based on cursor position
      list.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = list.querySelector(".dragging");
        if (!dragging) return;
        const after = getDragAfter(e.clientY);
        if (after == null) list.appendChild(dragging);
        else list.insertBefore(dragging, after);
      });

      function getDragAfter(y) {
        const items = [...list.querySelectorAll(".task:not(.dragging)")];
        return items.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset, element: child };
            return closest;
          },
          { offset: -Infinity, element: null }
        ).element;
      }

      async function persistOrder() {
        const ids = [...list.querySelectorAll(".task")].map((li) => li.dataset.id);
        // keep local order in sync, then save
        tasks.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
        const res = await api("/reorder", { ids });
        if (res && res.tasks) tasks = res.tasks;
      }

      async function addTask() {
        const input = document.getElementById("new");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        await api("/add", { text });
        refresh();
      }

      document.getElementById("add").onclick = addTask;
      document.getElementById("new").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });
      document.getElementById("clear").onclick = async () => {
        await api("/clear-done", {});
        refresh();
      };

      refresh();
    </script>
  </body>
</html>
