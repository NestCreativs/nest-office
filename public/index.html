<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nest Creativs Office</title>
    <link rel="stylesheet" href="/style.css?v=6" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div class="app">
      <!-- Floating button to reopen the sidebar when collapsed -->
      <button id="sidebar-open" class="sidebar-open" title="Show sidebar" aria-label="Show sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/logo.svg" alt="Nest Creativs" />
          <div class="brand-text">
            <strong>Nest Creativs</strong>
            <small>Office</small>
          </div>
          <button id="sidebar-toggle" class="sidebar-toggle" title="Hide sidebar" aria-label="Hide sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
          </button>
        </div>

        <div class="search">
          <input id="search" type="search" placeholder="Search tools…" autocomplete="off" />
        </div>

        <nav id="tool-list" class="tool-list" aria-label="Tools">
          <div class="empty">Loading…</div>
        </nav>

        <div class="sidebar-footer">
          <button id="theme-toggle" class="ghost-btn" title="Toggle theme">◐ Theme</button>
          <a class="ghost-btn" href="/tools/_docs/ui.html" target="content-frame">＋ New tool</a>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <!-- Home / welcome -->
        <section id="home" class="home">
          <header class="home-head">
            <h1>Nest Creativs Office</h1>
            <p>Your private workspace. Every tool runs locally on your machine — pick one to start, or add your own.</p>
          </header>
          <div id="cards" class="cards"></div>
        </section>

        <!-- A tool loads here, isolated in its own frame -->
        <div id="frame-wrap" class="frame-wrap" hidden>
          <div class="tool-bar">
            <button id="back-btn" class="ghost-btn">← All tools</button>
            <span id="tool-title" class="tool-title"></span>
            <a id="open-new" class="ghost-btn" target="_blank" rel="noopener">↗ Open full</a>
          </div>
          <iframe id="content-frame" name="content-frame" title="Tool" src="about:blank" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
        </div>
      </main>
    </div>

    <script src="/app.js?v=4"></script>
  </body>
</html>
